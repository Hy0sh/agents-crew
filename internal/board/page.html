<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>acw board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root {
  --bg: #f3f5f7; --panel: #fff; --fg: #1b2530; --muted: #5d6b79; --line: #d9e0e7;
  --accent: #1f6f8b; --accent-soft: #e2eff4;
  --ok: #2f7d4f; --ok-soft: #e3f2e8; --warn: #9a6a00; --warn-soft: #fbf1d9;
  --bad: #b3372f; --bad-soft: #f8e3e1; --idle: #6b7785; --idle-soft: #eceff2;
  --f-display: "Fraunces", Georgia, serif; --f-body: "Atkinson Hyperlegible", system-ui, sans-serif; --f-data: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --panel: #18212a; --fg: #e6ecf1; --muted: #93a2b1; --line: #2a3642;
  --accent: #5fb3cf; --accent-soft: #1b3440; --ok: #6cc28f; --ok-soft: #173326;
  --warn: #e2b24a; --warn-soft: #3a2f14; --bad: #ef7d74; --bad-soft: #3d1d1b; --idle: #9aa6b2; --idle-soft: #232d37; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #18212a; --fg: #e6ecf1; --muted: #93a2b1; --line: #2a3642;
  --accent: #5fb3cf; --accent-soft: #1b3440; --ok: #6cc28f; --ok-soft: #173326;
  --warn: #e2b24a; --warn-soft: #3a2f14; --bad: #ef7d74; --bad-soft: #3d1d1b; --idle: #9aa6b2; --idle-soft: #232d37; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 28px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font: 600 clamp(1.6rem, 3vw, 2.1rem)/1.15 var(--f-display); margin: 0; }
h1 small { font: 400 15px var(--f-data); color: var(--muted); margin-left: 8px; }
.stamp { font: 13px var(--f-data); color: var(--muted); }
.stamp .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
.strip { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: grid; min-width: 150px; flex: 1 1 150px; }
.tile[hidden] { display: none; }
.tile b { font: 600 1.5rem/1.1 var(--f-data); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.filters input, .filters select { font: 14px var(--f-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.filters input { flex: 1 1 260px; min-width: 0; }
.filters label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.grid { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } .full { grid-column: 1 / -1; } }
h2 { font: 700 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
h2 .count { font-family: var(--f-data); color: var(--accent); }
.list { display: grid; gap: 8px; }
.workers { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.row { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--idle); border-radius: 6px; padding: 10px 14px; display: grid; gap: 4px; min-width: 0; }
[data-tone="ok"].row { border-left-color: var(--ok); } [data-tone="warn"].row { border-left-color: var(--warn); }
[data-tone="bad"].row { border-left-color: var(--bad); } [data-tone="accent"].row { border-left-color: var(--accent); }
.top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.title { font-weight: 700; overflow-wrap: anywhere; }
.who { font: 600 13px var(--f-data); }
.ref { font: 12px var(--f-data); color: var(--accent); }
.ref a { color: inherit; }
.meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.time { font: 12px var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.pill { font: 600 11px var(--f-data); padding: 2px 8px; border-radius: 99px; background: var(--idle-soft); color: var(--idle); white-space: nowrap; }
[data-tone="ok"].pill { background: var(--ok-soft); color: var(--ok); } [data-tone="warn"].pill { background: var(--warn-soft); color: var(--warn); }
[data-tone="bad"].pill { background: var(--bad-soft); color: var(--bad); } [data-tone="accent"].pill { background: var(--accent-soft); color: var(--accent); }
.why { font-size: 13.5px; } .why::before { content: "Why: "; color: var(--muted); }
.timeline .row { grid-template-columns: 56px minmax(0, 1fr); column-gap: 12px; }
.timeline .time { margin: 0; padding-top: 2px; }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 14px; color: var(--muted); font-size: 14px; }
.more { justify-self: start; font: 600 13px var(--f-body); color: var(--accent); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; cursor: pointer; margin-top: 8px; }
.more:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="repo-name">acw board</span> <small id="repo-sub"></small></h1>
    <div class="stamp" id="stamp">Loading…</div>
  </header>
  <div class="strip">
    <div class="tile live-only"><b id="n-busy">–</b><span>Workers busy</span></div>
    <div class="tile live-only"><b id="n-prs">–</b><span>PRs followed</span></div>
    <div class="tile"><b id="n-today">–</b><span id="l-today">Handled today</span></div>
    <div class="tile"><b id="n-decisions">–</b><span>Decisions</span></div>
  </div>
  <div class="filters" role="search">
    <label>Repo <select id="repo"></select></label>
    <label>Day <select id="day"></select></label>
    <input id="q" type="search" placeholder="Search a ticket, a PR, a word…" aria-label="Search">
    <label>Worker <select id="w"><option value="">All</option></select></label>
  </div>
  <div class="grid">
    <section class="full live-only"><h2>Workers <span class="count" id="c-workers"></span></h2><div class="workers" id="workers"></div></section>
    <section class="live-only"><h2>Pull requests followed <span class="count" id="c-prs"></span></h2><div class="list" id="prs"></div></section>
    <section><h2>Decisions <span class="count" id="c-decisions"></span></h2><div class="list" id="decisions"></div><button type="button" id="more" class="more" hidden>Show 8 more</button></section>
    <section class="full"><h2>Handled <span class="count" id="c-today"></span></h2><div class="list timeline" id="today"></div></section>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const tone = s => /block|fail|red|refus|dropped|conflict|closed/i.test(s) ? "bad"
  : /review|draft|running|wait|verdict|plan/i.test(s) ? "warn"
  : /merged|green|approved|free|done/i.test(s) ? "ok"
  : /busy|coding|open|progress/i.test(s) ? "accent" : "idle";
const pill = (s, prefix = "") => { const p = el("span", "pill", prefix + s); p.dataset.tone = tone(s); return p; };
const row = t => { const r = el("article", "row"); r.dataset.tone = t; return r; };
const hm = iso => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const prNum = url => (url || "").match(/\/pull\/(\d+)/)?.[1];
const link = (text, url) => { const s = el("span", "ref"); if (url) { const a = el("a", null, text); a.href = url; a.target = "_blank"; a.rel = "noopener"; s.append(a); } else s.textContent = text; return s; };

function worker(d) {
  const r = row(tone(d.state)), top = el("div", "top");
  top.append(el("span", "who", d.worker), pill(d.state || "free"), el("span", "time", "since " + hm(d.since)));
  r.append(top);
  if (d.subject) r.append(el("div", "title", d.subject));
  const ref = el("div", "top");
  if (prNum(d.pr_url)) ref.append(link("#" + prNum(d.pr_url), d.pr_url));
  if (d.branch) ref.append(el("span", "ref", d.branch));
  if (ref.childElementCount) r.append(ref);
  if (d.summary) r.append(el("div", "meta", d.summary));
  return r;
}
function pr(d) {
  const r = row(tone(d.status)), top = el("div", "top");
  top.append(link("#" + d.number, d.url), pill(d.status || "open"));
  if (d.ci) top.append(pill(d.ci, "CI "));
  r.append(top);
  if (d.title) r.append(el("div", "title", d.title));
  const meta = [d.worker, d.base && "base " + d.base, d.review].filter(Boolean).join(" · ");
  if (meta) r.append(el("div", "meta", meta));
  return r;
}
function decision(d) {
  const r = row("accent"), top = el("div", "top");
  if (d.subject) top.append(el("span", "ref", d.subject));
  if (d.worker) top.append(el("span", "who", d.worker));
  top.append(el("span", "time", hm(d.at)));
  r.append(top, el("div", null, d.text));
  if (d.why) r.append(el("div", "why", d.why));
  return r;
}
function handled(d) {
  const r = row(tone(d.outcome)), body = el("div"), top = el("div", "top");
  top.append(el("span", "title", d.subject || "task #" + d.task));
  if (prNum(d.pr_url)) top.append(link("#" + prNum(d.pr_url), d.pr_url));
  if (d.outcome) top.append(pill(d.outcome));
  body.append(top, el("div", "meta", [d.worker, d.summary].filter(Boolean).join(" · ")));
  r.append(el("span", "time", hm(d.at)), body);
  return r;
}

const store = { get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const state = { repo: store.get("repo"), day: store.get("day"), q: store.get("q"), w: store.get("w"), shown: 8 };
let repos = [], board = null;
const today = () => new Date().toLocaleDateString("sv");  // YYYY-MM-DD, local

const keep = d => (!state.w || d.worker === state.w) && (!state.q || Object.values(d).join(" ").toLowerCase().includes(state.q.toLowerCase()));
function fill(id, items, build, empty, limit) {
  const box = $(id), shown = items.filter(keep), cut = limit ? shown.slice(0, limit) : shown;
  box.replaceChildren(...(cut.length ? cut.map(build) : [el("div", "empty", empty)]));
  $("c-" + id).textContent = shown.length === items.length ? items.length : `${shown.length} / ${items.length}`;
  return shown.length;
}
function options(select, values, current, label = v => v) {
  if ([...select.options].map(o => o.value).join() !== values.join()) select.replaceChildren(...values.map(v => { const o = el("option", null, label(v)); o.value = v; return o; }));
  select.value = values.includes(current) ? current : values[0] || "";
  return select.value;
}
function render() {
  if (!board) return;
  const live = board.live;
  document.querySelectorAll(".live-only").forEach(s => s.hidden = !live);
  $("stamp").textContent = live ? "Live, refreshed every 5 s" : "Swarm not running on this day";
  fill("workers", board.workers, worker, "No worker open.");
  fill("prs", board.prs, pr, "No pull request followed.");
  const matching = fill("decisions", board.decisions, decision, "No decision recorded.", state.shown);
  $("more").hidden = matching <= state.shown;
  fill("today", board.handled, handled, "Nothing handled on this day.");
  $("l-today").textContent = state.day ? "Handled" : "Handled today";
  $("n-busy").textContent = `${board.workers.filter(w => w.state !== "free").length} / ${board.workers.length}`;
  $("n-prs").textContent = board.prs.length;
  $("n-today").textContent = board.handled.length;
  $("n-decisions").textContent = board.decisions.length;
  const names = [...new Set([...board.workers, ...board.prs, ...board.handled, ...board.decisions].map(d => d.worker).filter(Boolean))].sort();
  options($("w"), ["", ...names], state.w, v => v || "All");
}
async function load() {
  try {
    repos = await (await fetch("/api/repos")).json();
    state.repo = options($("repo"), repos.map(r => r.repo), state.repo, r => r.split("/").pop());
    const days = repos.find(r => r.repo === state.repo)?.days || [];
    // "" is today, followed: a page left open past midnight moves on.
    state.day = options($("day"), ["", ...days.filter(d => d !== today())], state.day, d => d || "Today");
    $("repo-name").textContent = state.repo ? state.repo.split("/").pop() : "acw board";
    $("repo-sub").textContent = state.repo ? "acw · " + state.repo : "";
    const q = new URLSearchParams({ repo: state.repo, day: state.day || today() });
    board = await (await fetch("/api/board?" + q)).json();
    render();
  } catch (e) {
    $("stamp").textContent = "acw board is not answering: " + e.message;
  }
}
const on = (id, ev, f) => $(id).addEventListener(ev, f);
on("repo", "change", e => { state.repo = e.target.value; state.day = ""; state.shown = 8; store.set("repo", state.repo); store.set("day", ""); load(); });
on("day", "change", e => { state.day = e.target.value; state.shown = 8; store.set("day", state.day); load(); });
on("q", "input", e => { state.q = e.target.value; store.set("q", state.q); render(); });
on("w", "change", e => { state.w = e.target.value; store.set("w", state.w); render(); });
on("more", "click", () => { state.shown += 8; render(); });
$("q").value = state.q;
load();
setInterval(load, 5000);
</script>
</body>
</html>
