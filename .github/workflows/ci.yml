name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # staticcheck 0.8.1 ships an x/tools that can't read Go 1.27.2's
      # export data: it is built with the latest x/tools instead.
      # ponytail: back to `go run …staticcheck@latest` once a release follows.
      - name: Unused code
        run: |
          (cd "$(mktemp -d)" && go mod init sc && go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest && go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck)
          "$RUNNER_TEMP/staticcheck" ./...
